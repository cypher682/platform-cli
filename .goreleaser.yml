version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: .
    binary: platform-cli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/cypher682/platform-cli/cmd.version={{.Version}}
      - -X github.com/cypher682/platform-cli/cmd.commit={{.Commit}}
      - -X github.com/cypher682/platform-cli/cmd.date={{.Date}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - README-ENHANCED.md
      - platform.yaml.example
      - install.sh
      - install.ps1

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
